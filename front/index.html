<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ScholarLens - 学术文献智能搜索与筛选平台">
  <title>ScholarLens - 学术文献搜索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/index.css">
</head>

<body>
  <!-- Sidebar for History -->
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <h3 class="sidebar-title">
        <i class="bi bi-clock-history"></i>
        <span>查询历史</span>
        <span id="history-count" class="sidebar-count">0</span>
      </h3>
      <div class="sidebar-header-actions">
        <button id="history-refresh" class="sidebar-icon-btn" aria-label="刷新" title="刷新历史">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button id="sidebar-close" class="sidebar-icon-btn" aria-label="关闭" title="关闭">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <div class="sidebar-search">
      <i class="bi bi-search"></i>
      <input id="history-search" type="search" placeholder="搜索关键词..." autocomplete="off">
    </div>
    <div id="history-list" class="history-list" role="list">
      <!-- History items will be inserted here -->
    </div>
    <div class="sidebar-footer">
      <p class="sidebar-note">
        <i class="bi bi-info-circle"></i>
        <span>服务器记录在 2 小时未访问后自动删除</span>
      </p>
      <button id="clear-history" class="btn btn-small btn-outline">
        <i class="bi bi-trash3"></i>
        <span>清空全部历史</span>
      </button>
    </div>
  </aside>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Main Content -->
  <main id="app">
    <!-- Page content will be rendered here by router -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-text">ScholarLens · 学术文献智能搜索平台</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
